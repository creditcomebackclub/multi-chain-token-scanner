services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scanner-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      retries: 10
  scanner:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://scanner:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/scanner
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
volumes:
  scanner-data:
